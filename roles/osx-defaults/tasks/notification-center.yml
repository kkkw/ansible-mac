- debug:
    var: ncprefs_apps

- community.general.osx_defaults: { domain: 'com.apple.ncprefs', key: 'apps', type: array, value: "{{ item }}" }
  loop:
    - []
    - "{{ ncprefs_apps }}"
  when: ncprefs_apps is defined and ncprefs_apps != []
  changed_when: no
  notify: Restart NotificationCenter
